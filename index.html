<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Титры Бокс / Кикбоксинг LIVE</title>
    <style>
        html, body {
            margin: 0; padding: 0; background: transparent;
            font-family: 'Impact', 'Arial Black', sans-serif; font-weight: normal; color: white;
            overflow: hidden; width: 100vw; height: 100vh; position: relative; box-sizing: border-box;
        }
        /* Главный контейнер графики - теперь привязан К НИЗУ виджета */
        .graphics-wrapper {
            position: absolute; 
            bottom: 15px; 
            left: 50%;
            transform: translateX(-50%); 
            display: flex; flex-direction: column; align-items: center;
            width: 95%; 
            max-width: 1200px;
        }
        /* Блок по центру, объединяющий раунд и пару */
        .center-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        /* Плашка Раунда — вынесена наверх, больше не обрезается */
        .round-bar {
            background: #000000;
            color: #ffffff;
            font-size: 20px; 
            padding: 4px 20px;
            letter-spacing: 2px;
            border-top-left-radius: 5px;
            border-top-right-radius: 5px;
            border: 2px solid #252525;
            border-bottom: none;
            min-width: 90px;
            text-align: center;
            z-index: 10;
        }
        /* Основная линия с бойцами */
        .main-bar { 
            display: flex; 
            width: 100%;
            align-items: flex-end; 
            background: #1a1a1a; 
            border-top-left-radius: 8px; border-top-right-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            box-sizing: border-box;
        }
        .badge { 
            text-transform: uppercase; text-align: center; 
            white-space: nowrap; 
            font-size: 32px; 
            letter-spacing: 1px; 
            height: 60px; 
            display: flex; align-items: center;
            box-sizing: border-box;
        }
        /* Белый контрастный центр */
        .pair-num { 
            background: linear-gradient(to bottom, #ffffff, #e1e1e1); 
            color: #000000; 
            min-width: 130px; 
            font-size: 26px; 
            justify-content: center; 
            z-index: 5; 
            border-left: 2px solid rgba(0,0,0,0.3);
            border-right: 2px solid rgba(0,0,0,0.3);
            height: 60px;
        }
        /* Красный угол */
        .red-corner { 
            background: linear-gradient(to left, #7a0000, #cc0000); 
            flex: 1; 
            justify-content: flex-end; 
            padding-right: 20px;
            gap: 12px; 
        }
        /* Синий угол */
        .blue-corner { 
            background: linear-gradient(to right, #002a99, #0044cc); 
            flex: 1; 
            justify-content: flex-start; 
            padding-left: 20px;
            gap: 12px; 
        }
        /* Логотип клуба */
        .club-logo { width: 42px; height: 42px; object-fit: contain; border-radius: 50%; }

        /* Нижняя плашка с названием турнира */
        .tournament-bar {
            background: rgba(17, 17, 17, 0.95); 
            width: 100%; text-align: center;
            padding: 6px 0; font-size: 16px; color: #dddddd;
            text-transform: uppercase; letter-spacing: 3px;
            border-top: 2px solid #252525;
            box-shadow: 0 5px 20px rgba(0,0,0,0.6);
            border-bottom-left-radius: 8px; border-bottom-right-radius: 8px;
            box-sizing: border-box;
        }
    </style>
    <!-- Подключаем официальную библиотеку связи Google Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="graphics-wrapper">
        <!-- Раунд теперь аккуратно отображается сверху -->
        <div class="round-bar" id="round">РАУНД 1</div>
        
        <div class="main-bar">
            <div class="badge red-corner">
                <span id="red">БОЕЦ КРАСНЫЙ</span>
                <img src="" class="club-logo" id="red-logo" style="display:none;">
            </div>
            <div class="pair-num" id="pair">ПАРА №1</div>
            <div class="badge blue-corner">
                <img src="" class="club-logo" id="blue-logo" style="display:none;">
                <span id="blue">БОЕЦ СИНИЙ</span>
            </div>
        </div>

        <!-- Название турнира гармонично закрывает плашку снизу -->
        <div class="tournament-bar" id="tournament">ТУРНИР</div>
    </div>

    <script>
        // ИСПРАВЛЕНО: Синхронизировано с базой данных пульта управления
        const firebaseConfig = {
            databaseURL: 'https://mfteam-default-rtdb.firebaseio.com/'
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref('live_graphics');

        // Ловим изменения "на лету" — без перезагрузок страницы
        db.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                if(data.tournament_title) document.getElementById('tournament').innerText = data.tournament_title;
                if(data.pair_num) document.getElementById('pair').innerText = data.pair_num;
                if(data.round_num) document.getElementById('round').innerText = data.round_num;
                if(data.red_name) document.getElementById('red').innerText = data.red_name;
                if(data.blue_name) document.getElementById('blue').innerText = data.blue_name;
                
                const redLogo = document.getElementById('red-logo');
                const blueLogo = document.getElementById('blue-logo');
                
                if (data.logo_url && data.logo_url.trim() !== "" && data.logo_url !== "https://icons8.com") {
                    redLogo.src = data.logo_url; redLogo.style.display = "block";
                    blueLogo.src = data.logo_url; blueLogo.style.display = "block";
                } else {
                    redLogo.style.display = "none"; blueLogo.style.display = "none";
                }
            }
        });
    </script>
</body>
</html>
